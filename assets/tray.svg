<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img" aria-label="Tray menu: Pause, Start with Windows (checked), Exit">
  <style>
    .ui { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    .hl { animation: hl 6s infinite ease-in-out; }
    @keyframes hl { 0%,15% {transform: translateY(0)} 25%,60% {transform: translateY(36px)} 70%,100% {transform: translateY(0)} }
    @media (prefers-reduced-motion: reduce) { .hl { animation: none; } }
  </style>
  <rect width="560" height="230" rx="16" fill="#0f172a"/>

  <!-- Menu -->
  <rect x="24" y="20" width="270" height="170" rx="10" fill="#2b2b2b" stroke="#3f3f3f"/>
  <text x="44" y="50" class="ui" font-size="14" fill="#8a8a8a">Capslock-CopyPaste</text>
  <rect x="32" y="62" width="254" height="1" fill="#454545"/>
  <rect class="hl" x="30" y="70" width="258" height="32" rx="6" fill="#3d3d3d"/>
  <text x="68" y="91" class="ui" font-size="14" fill="#f3f3f3">Pause</text>
  <text x="44" y="127" class="ui" font-size="14" fill="#f3f3f3">✓</text>
  <text x="68" y="127" class="ui" font-size="14" fill="#f3f3f3">Start with Windows</text>
  <rect x="32" y="144" width="254" height="1" fill="#454545"/>
  <text x="68" y="172" class="ui" font-size="14" fill="#f3f3f3">Exit</text>

  <!-- Taskbar tray -->
  <rect x="24" y="200" width="270" height="22" rx="6" fill="#1c1c1c"/>
  <g fill="none" stroke="#fff" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"><path d="M248 204.5 L254.5 211 H251 V214.5 H245 V211 H241.5 Z"/><path d="M245 218 H251"/></g>
  <path d="M248 198 v-4" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Notes -->
  <g class="ui" font-size="14" fill="#cbd5e1">
    <text x="316" y="90"><tspan font-weight="700" fill="#f8fafc">Pause</tspan> — Caps Lock works</text>
    <text x="316" y="108">normally until you resume</text>
    <text x="316" y="128"><tspan font-weight="700" fill="#f8fafc">Start with Windows</tspan> — runs</text>
    <text x="316" y="146">at login, no admin pop-up</text>
    <text x="316" y="200" fill="#94a3b8">Right-click the tray icon</text>
    <text x="316" y="218" fill="#94a3b8">Double-click it = Pause / Resume</text>
  </g>
</svg>
